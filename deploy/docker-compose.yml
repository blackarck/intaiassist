# Backend + Caddy reverse proxy on one VM.
# Run from this directory with the env file the deploy script writes:
#   docker compose --env-file /opt/intassist/.env up -d --build
#
# Only Caddy publishes ports. The backend is reachable solely through Caddy on the internal network.
services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: /opt/intassist/.env
    security_opt:
      - no-new-privileges:true # the app (non-root) can never gain more rights
    cap_drop:
      - ALL # a Node web service needs no Linux capabilities
    init: true # reaps zombies and forwards SIGTERM so the app can close the database cleanly
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/intassist.db
    volumes:
      - backend_data:/data # SQLite database + backups; losing this volume loses all interviews and transcripts
    expose:
      - "3000"
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in /opt/intassist/.env}
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN must be set in /opt/intassist/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/intassist/web:/srv/web:ro # the built web app, put there by the deploy script
      - caddy_data:/data # certificates live here; keep this volume
      - caddy_config:/config
    logging: *logging

volumes:
  backend_data:
  caddy_data:
  caddy_config:
